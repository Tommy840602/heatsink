services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      THERMOFORM_ENV: development
      THERMOFORM_CORS_ORIGINS: http://localhost:3000
      THERMOFORM_REDIS_URL: redis://redis:6379/0
      THERMOFORM_ARTIFACT_DIR: /data
      THERMOFORM_HEARTBEAT_STALE_SECONDS: 120
      THERMOFORM_WATCHDOG_STALE_SECONDS: 180
    volumes:
      - thermoform-artifacts:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379/0 thermoform
    environment:
      THERMOFORM_REDIS_URL: redis://redis:6379/0
      THERMOFORM_ARTIFACT_DIR: /data
    volumes:
      - thermoform-artifacts:/data
    depends_on:
      redis:
        condition: service_healthy

  watchdog:
    build: ./backend
    command: rq cron app.cron_config --url redis://redis:6379/0
    environment:
      THERMOFORM_REDIS_URL: redis://redis:6379/0
      THERMOFORM_ARTIFACT_DIR: /data
      THERMOFORM_WATCHDOG_INTERVAL_SECONDS: 60
      THERMOFORM_WATCHDOG_GRACE_SECONDS: 900
    volumes:
      - thermoform-artifacts:/data
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.33.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:12.4.8
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: thermoform
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  cae-worker:
    profiles: ["cae"]
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.openfoam
    command: rq worker --url redis://redis:6379/0 --name openfoam-v2312-worker thermoform-cae
    environment:
      THERMOFORM_REDIS_URL: redis://redis:6379/0
      THERMOFORM_ARTIFACT_DIR: /data
    volumes:
      - thermoform-artifacts:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/openfoam-worker", "/usr/bin/openfoam2312", "-show-api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
  thermoform-artifacts:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  prometheus:
    image: prom/prometheus:v3.5.5
    environment:
      THERMOFORM_PROMETHEUS_REPLICA: prometheus-1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=64MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19100:9090"
    depends_on:
      - alertmanager
      - alertmanager-2
      - thanos-receive

  prometheus-2:
    image: prom/prometheus:v3.5.5
    environment:
      THERMOFORM_PROMETHEUS_REPLICA: prometheus-2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=64MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-2-data:/prometheus
    ports:
      - "127.0.0.1:19104:9090"
    depends_on:
      - alertmanager
      - alertmanager-2
      - thanos-receive

  alertmanager:
    image: prom/alertmanager:v0.33.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=24h
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager-2:9094
      - --cluster.peer-name=alertmanager-1
      - --cluster.label=thermoform-state-drill
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:19101:9093"

  alertmanager-2:
    image: prom/alertmanager:v0.33.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=24h
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager:9094
      - --cluster.peer-name=alertmanager-2
      - --cluster.label=thermoform-state-drill
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-2-data:/alertmanager
    ports:
      - "127.0.0.1:19102:9093"

  thanos-receive-init:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 1001:1001 /thanos/receive-1 /thanos/receive-2 /thanos/receive-3 /thanos/object-store /thanos/store
    volumes:
      - thanos-receive-data:/thanos/receive-1
      - thanos-receive-2-data:/thanos/receive-2
      - thanos-receive-3-data:/thanos/receive-3
      - thanos-object-store-data:/thanos/object-store
      - thanos-store-data:/thanos/store

  thanos-receive:
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - receive
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --remote-write.address=0.0.0.0:19291
      - --tsdb.path=/thanos/receive
      - --tsdb.retention=7d
      - --tsdb.wal-compression
      - --tsdb.too-far-in-future.time-window=5m
      - --receive.replication-factor=3
      - --receive.hashrings-algorithm=ketama
      - --receive.local-endpoint=thanos-receive:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --label=receive_cluster="thermoform-state-drill"
      - --label=receive_replica="receive-1"
      - --objstore.config-file=/etc/thanos/object-store.yml
    volumes:
      - ../thanos/hashring.json:/etc/thanos/hashring.json:ro
      - ../thanos/object-store.yml:/etc/thanos/object-store.yml:ro
      - thanos-receive-data:/thanos/receive
      - thanos-object-store-data:/thanos/object-store
    ports:
      - "127.0.0.1:19105:10902"
    depends_on:
      thanos-receive-init:
        condition: service_completed_successfully

  thanos-receive-2:
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - receive
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --remote-write.address=0.0.0.0:19291
      - --tsdb.path=/thanos/receive
      - --tsdb.retention=7d
      - --tsdb.wal-compression
      - --receive.replication-factor=3
      - --receive.hashrings-algorithm=ketama
      - --receive.local-endpoint=thanos-receive-2:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --label=receive_cluster="thermoform-state-drill"
      - --label=receive_replica="receive-2"
      - --objstore.config-file=/etc/thanos/object-store.yml
    volumes:
      - ../thanos/hashring.json:/etc/thanos/hashring.json:ro
      - ../thanos/object-store.yml:/etc/thanos/object-store.yml:ro
      - thanos-receive-2-data:/thanos/receive
      - thanos-object-store-data:/thanos/object-store
    ports:
      - "127.0.0.1:19113:10902"
    depends_on:
      thanos-receive-init:
        condition: service_completed_successfully

  thanos-receive-3:
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - receive
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --remote-write.address=0.0.0.0:19291
      - --tsdb.path=/thanos/receive
      - --tsdb.retention=7d
      - --tsdb.wal-compression
      - --receive.replication-factor=3
      - --receive.hashrings-algorithm=ketama
      - --receive.local-endpoint=thanos-receive-3:10901
      - --receive.hashrings-file=/etc/thanos/hashring.json
      - --label=receive_cluster="thermoform-state-drill"
      - --label=receive_replica="receive-3"
      - --objstore.config-file=/etc/thanos/object-store.yml
    volumes:
      - ../thanos/hashring.json:/etc/thanos/hashring.json:ro
      - ../thanos/object-store.yml:/etc/thanos/object-store.yml:ro
      - thanos-receive-3-data:/thanos/receive
      - thanos-object-store-data:/thanos/object-store
    ports:
      - "127.0.0.1:19114:10902"
    depends_on:
      thanos-receive-init:
        condition: service_completed_successfully

  thanos-store:
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - store
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --data-dir=/thanos/store
      - --objstore.config-file=/etc/thanos/object-store.yml
      - --sync-block-duration=5s
    volumes:
      - ../thanos/object-store.yml:/etc/thanos/object-store.yml:ro
      - thanos-object-store-data:/thanos/object-store:ro
      - thanos-store-data:/thanos/store
    ports:
      - "127.0.0.1:19115:10902"
    depends_on:
      thanos-receive-init:
        condition: service_completed_successfully

  thanos-query:
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - query
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --endpoint=thanos-receive:10901
      - --endpoint=thanos-receive-2:10901
      - --endpoint=thanos-receive-3:10901
      - --endpoint=thanos-store:10901
      - --query.replica-label=replica
      - --query.replica-label=receive_replica
    ports:
      - "127.0.0.1:19103:10902"
    depends_on:
      - thanos-receive
      - thanos-receive-2
      - thanos-receive-3
      - thanos-store

volumes:
  prometheus-data:
  prometheus-2-data:
  alertmanager-data:
  alertmanager-2-data:
  thanos-receive-data:
  thanos-receive-2-data:
  thanos-receive-3-data:
  thanos-object-store-data:
  thanos-store-data:

global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    cluster: thermoform-state-drill
    replica: prometheus-1

alerting:
  alert_relabel_configs:
    - action: labeldrop
      regex: replica
  alertmanagers:
    - static_configs:
          - targets:
            - alertmanager:9093
            - alertmanager-2:9093

scrape_configs:
  - job_name: thermoform-prometheus
    static_configs:
      - targets:
          - localhost:9090

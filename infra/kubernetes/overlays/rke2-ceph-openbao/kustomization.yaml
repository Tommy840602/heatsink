apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../observability
  - secret-provider-classes.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: thanos-receive
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: object-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: thanos-receive-object-store
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: thermoform-ceph-block
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: thanos-store
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: object-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: thanos-store-object-store
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: thanos-compact
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: object-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: thanos-compact-object-store
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: thermoform-ceph-block

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: store
spec:
  serviceName: thanos-store-headless
  replicas: 2
  podManagementPolicy: Parallel
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10902"
    spec:
      serviceAccountName: thanos-store
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: thanos
              app.kubernetes.io/component: store
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: thanos
                  app.kubernetes.io/component: store
              topologyKey: kubernetes.io/hostname
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          imagePullPolicy: IfNotPresent
          args:
            - store
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/object-store/object-store.yml
            - --sync-block-duration=5m
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: store-cache
              mountPath: /var/thanos/store
            - name: object-store
              mountPath: /etc/thanos/object-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: object-store
          secret:
            secretName: thermoform-thanos-object-store
            items:
              - key: object-store.yml
                path: object-store.yml
        - name: store-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}

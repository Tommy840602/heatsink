apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-headless
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
    - name: remote-write
      port: 19291
      targetPort: remote-write
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
  ports:
    - name: remote-write
      port: 19291
      targetPort: remote-write
---

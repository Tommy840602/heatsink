apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compact
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compact
spec:
  serviceName: thanos-compact
  replicas: 1
  minReadySeconds: 15
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: compact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: compact
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10902"
    spec:
      serviceAccountName: thanos-compact
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          imagePullPolicy: IfNotPresent
          args:
            - compact
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/object-store/object-store.yml
            - --wait
            - --wait-interval=5m
            - --compact.cleanup-interval=5m
            - --retention.resolution-raw=$(THERMOFORM_THANOS_RETENTION_RAW)
            - --retention.resolution-5m=$(THERMOFORM_THANOS_RETENTION_5M)
            - --retention.resolution-1h=$(THERMOFORM_THANOS_RETENTION_1H)
          envFrom:
            - configMapRef:
                name: thanos-retention
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: compact-data
              mountPath: /var/thanos/compact
            - name: object-store
              mountPath: /etc/thanos/object-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: object-store
          secret:
            secretName: thermoform-thanos-object-store
            items:
              - key: object-store.yml
                path: object-store.yml
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: compact-data
        labels:
          app.kubernetes.io/name: thanos
          app.kubernetes.io/component: compact
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  serviceName: thanos-receive-headless
  replicas: 3
  podManagementPolicy: Parallel
  minReadySeconds: 15
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: receive
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10902"
    spec:
      serviceAccountName: thanos-receive
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: thanos
              app.kubernetes.io/component: receive
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: thanos
              app.kubernetes.io/component: receive
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          imagePullPolicy: IfNotPresent
          args:
            - receive
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --remote-write.address=0.0.0.0:19291
            - --tsdb.path=/var/thanos/receive
            - --tsdb.retention=30d
            - --tsdb.max-retention-bytes=100GB
            - --tsdb.wal-compression
            - --receive.replication-factor=3
            - --receive.hashrings-algorithm=ketama
            - --receive.local-endpoint=$(POD_NAME).thanos-receive-headless.$(POD_NAMESPACE).svc.cluster.local:10901
            - --receive.hashrings-file=/etc/thanos/hashring/hashring.json
            - --label=receive_cluster="thermoform-production"
            - --label=receive_replica="$(POD_NAME)"
            - --objstore.config-file=/etc/thanos/object-store/object-store.yml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
            - name: remote-write
              containerPort: 19291
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: receive-data
              mountPath: /var/thanos/receive
            - name: object-store
              mountPath: /etc/thanos/object-store
              readOnly: true
            - name: hashring
              mountPath: /etc/thanos/hashring
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: object-store
          secret:
            secretName: thermoform-thanos-object-store
            items:
              - key: object-store.yml
                path: object-store.yml
        - name: hashring
          configMap:
            name: thanos-receive-hashring
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: receive-data
        labels:
          app.kubernetes.io/name: thanos
          app.kubernetes.io/component: receive
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi

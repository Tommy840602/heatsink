services:
  metrics-fixture:
    image: python:3.12-alpine
    command: python /app/metrics_server.py
    volumes:
      - ./metrics_server.py:/app/metrics_server.py:ro
    ports:
      - "127.0.0.1:19096:8000"

  receiver-fixture:
    image: python:3.12-alpine
    command: python /app/receiver_server.py
    environment:
      EXPECTED_AUTHORIZATION: Bearer drill-token-not-a-secret
    volumes:
      - ./receiver_server.py:/app/receiver_server.py:ro
    ports:
      - "127.0.0.1:19094:8080"

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=64MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../prometheus/slo.yml:/etc/prometheus/slo.yml:ro
      - ../prometheus/delivery.yml:/etc/prometheus/delivery.yml:ro
      - ../prometheus/storage.yml:/etc/prometheus/storage.yml:ro
      - ./watchdog-missing.yml:/etc/prometheus/watchdog-missing.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - metrics-fixture
      - alertmanager
      - alertmanager-2

  alertmanager:
    image: prom/alertmanager:v0.33.0
    group_add:
      - ${THERMOFORM_DRILL_SECRET_GID:-65534}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager-2:9094
      - --cluster.peer-name=alertmanager-1
      - --cluster.label=thermoform-drill
    volumes:
      - ${THERMOFORM_DRILL_ALERTMANAGER_CONFIG:-../alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${THERMOFORM_DRILL_SECRET_DIR:-../alertmanager/secrets}:/run/secrets:ro
    ports:
      - "127.0.0.1:19093:9093"
    depends_on:
      - receiver-fixture

  alertmanager-2:
    image: prom/alertmanager:v0.33.0
    group_add:
      - ${THERMOFORM_DRILL_SECRET_GID:-65534}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager:9094
      - --cluster.peer-name=alertmanager-2
      - --cluster.label=thermoform-drill
    volumes:
      - ${THERMOFORM_DRILL_ALERTMANAGER_CONFIG:-../alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${THERMOFORM_DRILL_SECRET_DIR:-../alertmanager/secrets}:/run/secrets:ro
    ports:
      - "127.0.0.1:19095:9093"
    depends_on:
      - receiver-fixture

global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml
  - /etc/prometheus/watchdog-missing.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: thermoform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics-fixture:8000

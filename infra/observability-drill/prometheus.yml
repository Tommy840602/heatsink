global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    cluster: thermoform-drill
    replica: prometheus-1

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml
  - /etc/prometheus/delivery.yml
  - /etc/prometheus/storage.yml
  - /etc/prometheus/watchdog-missing.yml

alerting:
  alert_relabel_configs:
    - action: labeldrop
      regex: replica
  alertmanagers:
    - static_configs:
          - targets:
            - alertmanager:9093
            - alertmanager-2:9093

scrape_configs:
  - job_name: thermoform-prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: thermoform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics-fixture:8000

  - job_name: thermoform-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
          - alertmanager-2:9093

global:
  resolve_timeout: 5m

route:
  receiver: local-operations
  group_by:
    - service
    - component
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical-operations
      matchers:
        - severity="critical"
      repeat_interval: 1h
    - receiver: warning-operations
      matchers:
        - severity="warning"
      repeat_interval: 4h

receivers:
  - name: local-operations
  - name: critical-operations
  - name: warning-operations

inhibit_rules:
  - source_matchers:
      - alertname="ThermoformCaeApiDown"
    target_matchers:
      - service="thermoform-cae"
      - alertname!="ThermoformCaeApiDown"
    equal:
      - instance
  - source_matchers:
      - alertname="ThermoformCaeWatchdogMissing"
    target_matchers:
      - alertname="ThermoformCaeWatchdogStale"
    equal:
      - instance

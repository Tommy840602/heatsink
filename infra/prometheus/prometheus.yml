global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml
  - /etc/prometheus/delivery.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: thermoform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: thermoform-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

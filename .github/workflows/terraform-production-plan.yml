name: Production Terraform plan

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact 40-character main commit SHA to plan
        required: true
        type: string
      confirmation:
        description: Select PLAN_ONLY; this workflow has no apply path
        required: true
        type: choice
        options:
          - PLAN_ONLY

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-thanos-terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Guarded production plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-plan
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_ROOT: infra/terraform/environments/production
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TERRAFORM_PLAN_ROLE_ARN: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      THANOS_BUCKET_NAME: ${{ vars.THANOS_BUCKET_NAME }}
      THANOS_OBJECT_PREFIX: ${{ vars.THANOS_OBJECT_PREFIX }}
      EKS_OIDC_PROVIDER_ARN: ${{ vars.EKS_OIDC_PROVIDER_ARN }}
      EKS_OIDC_ISSUER_URL: ${{ vars.EKS_OIDC_ISSUER_URL }}
      TF_VAR_expected_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_bucket_name: ${{ vars.THANOS_BUCKET_NAME }}
      TF_VAR_object_prefix: ${{ vars.THANOS_OBJECT_PREFIX }}
      TF_VAR_cluster_oidc_provider_arn: ${{ vars.EKS_OIDC_PROVIDER_ARN }}
      TF_VAR_cluster_oidc_issuer_url: ${{ vars.EKS_OIDC_ISSUER_URL }}
    steps:
      - name: Check out exact workflow ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate immutable production inputs
        run: python scripts/validate_production_plan_inputs.py

      - name: Configure short-lived AWS plan credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: thermoform-plan-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true

      - name: Install pinned Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify AWS caller
        run: |
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$caller_account" = "$AWS_ACCOUNT_ID"

      - name: Initialize locked remote state
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform providers lock -platform=linux_amd64

      - name: Validate production root
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform fmt -check -diff -recursive
          terraform validate
          git diff --exit-code -- .terraform.lock.hcl

      - name: Create guarded plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          plan_file="${RUNNER_TEMP}/thermoform-production.tfplan"
          plan_json="${RUNNER_TEMP}/thermoform-production-plan.json"
          set +e
          terraform plan -input=false -lock=true -lock-timeout=5m \
            -detailed-exitcode -out="$plan_file" \
            > "${RUNNER_TEMP}/thermoform-production-plan.log" 2>&1
          plan_exit=$?
          set -e
          if test "$plan_exit" -eq 1; then
            echo "Terraform plan failed; no potentially sensitive plan output was printed." >&2
            exit 1
          fi
          terraform show -json "$plan_file" > "$plan_json"
          echo "has_changes=$([ "$plan_exit" -eq 2 ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"

      - name: Reject destructive or oversized plan
        run: |
          python scripts/summarize_terraform_plan.py \
            "${RUNNER_TEMP}/thermoform-production-plan.json" --max-changes 50 \
            --output "${RUNNER_TEMP}/thermoform-production-summary.md"
          cat "${RUNNER_TEMP}/thermoform-production-summary.md" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove sensitive plan files
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/thermoform-production.tfplan" \
            "${RUNNER_TEMP}/thermoform-production-plan.json" \
            "${RUNNER_TEMP}/thermoform-production-plan.log" \
            "${RUNNER_TEMP}/thermoform-production-summary.md"

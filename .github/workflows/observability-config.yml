name: Observability config

on:
  pull_request:
    paths:
      - .github/workflows/observability-config.yml
      - .github/workflows/terraform-production-plan.yml
      - docker-compose.yml
      - infra/**
      - docs/runbooks/cae-observability.md
      - scripts/run_observability_alert_drill.py
      - scripts/render_alertmanager_runtime.py
      - scripts/render_thanos_s3_config.py
      - scripts/validate_thanos_retention.py
      - scripts/validate_kubernetes_observability.py
      - scripts/render_eks_thanos_manifest.py
      - scripts/preflight_eks_thanos.py
      - scripts/run_eks_thanos_staging_drill.py
      - scripts/validate_terraform_thanos.py
      - scripts/validate_production_plan_contract.py
      - scripts/validate_production_plan_inputs.py
      - scripts/summarize_terraform_plan.py
      - scripts/validate_aws_bootstrap.py
      - scripts/audit_aws_bootstrap.py
      - scripts/validate_aws_bootstrap_audit.py
      - backend/tests/test_aws_bootstrap*.py
      - scripts/observability_state.py
      - scripts/run_observability_state_drill.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/observability-config.yml
      - .github/workflows/terraform-production-plan.yml
      - docker-compose.yml
      - infra/**
      - docs/runbooks/cae-observability.md
      - scripts/run_observability_alert_drill.py
      - scripts/render_alertmanager_runtime.py
      - scripts/render_thanos_s3_config.py
      - scripts/validate_thanos_retention.py
      - scripts/validate_kubernetes_observability.py
      - scripts/render_eks_thanos_manifest.py
      - scripts/preflight_eks_thanos.py
      - scripts/run_eks_thanos_staging_drill.py
      - scripts/validate_terraform_thanos.py
      - scripts/validate_production_plan_contract.py
      - scripts/validate_production_plan_inputs.py
      - scripts/summarize_terraform_plan.py
      - scripts/validate_aws_bootstrap.py
      - scripts/audit_aws_bootstrap.py
      - scripts/validate_aws_bootstrap_audit.py
      - backend/tests/test_aws_bootstrap*.py
      - scripts/observability_state.py
      - scripts/run_observability_state_drill.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate production Kubernetes topology
        run: |
          runtime_dir="$(mktemp -d)"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            registry.k8s.io/kubectl:v1.34.1 \
            kustomize /workspace/infra/kubernetes/observability \
            > "$runtime_dir/thanos-kubernetes.yml"
          docker run --rm \
            -v "$runtime_dir/thanos-kubernetes.yml:/work/manifests.yml:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.34.0 \
            /work/manifests.yml
          python scripts/validate_kubernetes_observability.py \
            "$runtime_dir/thanos-kubernetes.yml"

      - name: Validate AWS EKS production overlay
        run: |
          runtime_dir="$(mktemp -d)"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            registry.k8s.io/kubectl:v1.34.1 \
            kustomize /workspace/infra/kubernetes/overlays/aws-eks \
            > "$runtime_dir/eks-template.yml"
          python scripts/render_eks_thanos_manifest.py \
            --template "$runtime_dir/eks-template.yml" \
            --receive-role-arn arn:aws:iam::123456789012:role/thermoform-thanos-receive \
            --store-role-arn arn:aws:iam::123456789012:role/thermoform-thanos-store \
            --compact-role-arn arn:aws:iam::123456789012:role/thermoform-thanos-compact \
            --output "$runtime_dir/eks-production.yml"
          docker run --rm \
            -v "$runtime_dir/eks-production.yml:/work/manifests.yml:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.34.0 \
            /work/manifests.yml
          python scripts/validate_kubernetes_observability.py \
            "$runtime_dir/eks-production.yml"
          python -m compileall -q scripts/preflight_eks_thanos.py

      - name: Validate production Terraform root and module
        run: |
          terraform_dir="$PWD/infra/terraform"
          docker run --rm \
            -v "$terraform_dir:/work:ro" -w /work \
            hashicorp/terraform:1.15.8 fmt -check -diff -recursive
          runtime_dir="$(mktemp -d)"
          cp -R "$terraform_dir" "$runtime_dir/terraform"
          docker run --rm \
            -v "$runtime_dir/terraform:/work" \
            -w /work/environments/production \
            hashicorp/terraform:1.15.8 \
            init -backend=false -input=false
          docker run --rm \
            -v "$runtime_dir/terraform:/work" \
            -w /work/environments/production \
            hashicorp/terraform:1.15.8 validate
          python scripts/validate_terraform_thanos.py \
            "$terraform_dir/modules/aws-thanos-storage"
          python scripts/validate_production_plan_contract.py \
            "$terraform_dir/environments/production" \
            .github/workflows/terraform-production-plan.yml
          python -m pip install --disable-pip-version-check --quiet \
            cfn-lint==1.55.1 pytest==8.4.2
          cfn-lint --non-zero-exit-code warning \
            infra/aws-bootstrap/production-terraform-plan.yml
          python scripts/validate_aws_bootstrap.py \
            infra/aws-bootstrap/production-terraform-plan.yml
          python scripts/validate_aws_bootstrap_audit.py \
            scripts/audit_aws_bootstrap.py
          python -m compileall -q \
            scripts/run_eks_thanos_staging_drill.py \
            scripts/validate_production_plan_inputs.py \
            scripts/summarize_terraform_plan.py \
            scripts/validate_aws_bootstrap.py \
            scripts/audit_aws_bootstrap.py \
            scripts/validate_aws_bootstrap_audit.py
          python -m pytest -q \
            backend/tests/test_aws_bootstrap.py \
            backend/tests/test_aws_bootstrap_audit.py \
            backend/tests/test_aws_bootstrap_audit_contract.py

      - name: Render credential-free production S3 configuration
        run: |
          runtime_dir="$(mktemp -d)"
          python scripts/render_thanos_s3_config.py \
            --bucket thermoform-metrics-ci \
            --endpoint s3.ap-northeast-1.amazonaws.com \
            --region ap-northeast-1 \
            --prefix thermoform/metrics \
            --output "$runtime_dir/object-store.yml"
          test "$(stat -c '%a' "$runtime_dir/object-store.yml")" = 644
          if grep -Eq 'access_key:|secret_key:|session_token:' "$runtime_dir/object-store.yml"; then
            echo "Static S3 credential field found in rendered configuration" >&2
            exit 1
          fi
          THERMOFORM_THANOS_OBJECT_STORE_CONFIG="$runtime_dir/object-store.yml" \
            docker compose config --quiet

      - name: Validate deletion-safe Compactor retention
        run: |
          python scripts/validate_thanos_retention.py \
            --raw 0d --five-minutes 0d --one-hour 0d
          python scripts/validate_thanos_retention.py \
            --raw 365d --five-minutes 365d --one-hour 365d
          THERMOFORM_THANOS_RETENTION_RAW=365d \
          THERMOFORM_THANOS_RETENTION_5M=365d \
          THERMOFORM_THANOS_RETENTION_1H=365d \
            docker compose config --quiet

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/slo.test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/delivery.test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/storage.test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/ha.test.yml

      - name: Validate Alertmanager routes
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.webhook.example.yml

      - name: Render and validate production webhook configuration
        run: |
          runtime_dir="$(mktemp -d)"
          mkdir "$runtime_dir/secrets"
          chmod 750 "$runtime_dir" "$runtime_dir/secrets"
          python -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text("ci-fixture-not-a-secret\n"); os.chmod(p, 0o640)' "$runtime_dir/secrets/thermoform_alert_webhook_token"
          python scripts/render_alertmanager_runtime.py \
            --webhook-url https://incident.example.net/v1/thermoform \
            --secret-dir "$runtime_dir/secrets" \
            --output "$runtime_dir/alertmanager.yml"
          docker run --rm --entrypoint amtool \
            --group-add "$(id -g)" \
            -v "$runtime_dir/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$runtime_dir/secrets:/run/secrets:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool infra/grafana/dashboards/cae-resume-observability.json >/dev/null

  alert-drill:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Exercise Receive, Prometheus, and Alertmanager failover
        run: python scripts/run_observability_alert_drill.py

  state-drill:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Exercise eight-volume and object-store backup restore
        run: python scripts/run_observability_state_drill.py

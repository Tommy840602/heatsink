name: Observability config

on:
  pull_request:
    paths:
      - .github/workflows/observability-config.yml
      - docker-compose.yml
      - infra/**
      - docs/runbooks/cae-observability.md
      - scripts/run_observability_alert_drill.py
      - scripts/render_alertmanager_runtime.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/observability-config.yml
      - docker-compose.yml
      - infra/**
      - docs/runbooks/cae-observability.md
      - scripts/run_observability_alert_drill.py
      - scripts/render_alertmanager_runtime.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/slo.test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            test rules /etc/prometheus/tests/delivery.test.yml

      - name: Validate Alertmanager routes
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.webhook.example.yml

      - name: Render and validate production webhook configuration
        run: |
          runtime_dir="$(mktemp -d)"
          mkdir "$runtime_dir/secrets"
          chmod 750 "$runtime_dir" "$runtime_dir/secrets"
          python -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text("ci-fixture-not-a-secret\n"); os.chmod(p, 0o640)' "$runtime_dir/secrets/thermoform_alert_webhook_token"
          python scripts/render_alertmanager_runtime.py \
            --webhook-url https://incident.example.net/v1/thermoform \
            --secret-dir "$runtime_dir/secrets" \
            --output "$runtime_dir/alertmanager.yml"
          docker run --rm --entrypoint amtool \
            --group-add "$(id -g)" \
            -v "$runtime_dir/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$runtime_dir/secrets:/run/secrets:ro" \
            prom/alertmanager:v0.33.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool infra/grafana/dashboards/cae-resume-observability.json >/dev/null

  alert-drill:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exercise Prometheus to Alertmanager routing
        run: python scripts/run_observability_alert_drill.py
